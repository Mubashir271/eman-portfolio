<style>
/* Layout: a dark index of themed tiles; opening a project re-themes the whole site, and each project gets a full-screen cover, a brief and a gallery */
:root{
  --bg:#15120F; --fg:#F2ECE3; --accent:#E2B04A; --muted:#A1978A; --surface:#201C18;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Bricolage Grotesque',system-ui,sans-serif;
  --tt:none; --dw:800; --ds:100%; --dls:-0.02em;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;transition:background-color .5s,color .5s}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:760px){.wrap{padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:max(48px,env(safe-area-inset-right,0px))}}
.inner{max-width:1240px;margin:0 auto}

/* top bar */
.bar{position:fixed;inset:0 0 auto;z-index:20;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background-color .5s}
.bar .inner{display:flex;align-items:center;justify-content:space-between;gap:16px;height:58px}
.brand{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;text-decoration:none;letter-spacing:-.01em;font-size:17px}
.brand span{color:var(--accent)}
.nav{display:flex;align-items:center;gap:6px;font-size:13px;font-family:'Bricolage Grotesque',system-ui,sans-serif}
.nav a,.nav button{font:inherit;color:inherit;background:none;border:1px solid color-mix(in srgb,var(--fg) 22%,transparent);border-radius:999px;padding:6px 12px;text-decoration:none;cursor:pointer;line-height:1.2}
.nav a:hover,.nav button:hover{border-color:var(--accent);color:var(--accent)}
.count{font-variant-numeric:tabular-nums;color:var(--muted);padding:0 6px}
main{padding-top:calc(58px + env(safe-area-inset-top,0px))}

/* page numbers + contact strip */
.pages{display:none}
@media (min-width:900px){.pages{display:flex;gap:2px}}
.nav .pages a{border-color:transparent;padding:6px 8px;font-variant-numeric:tabular-nums;color:var(--muted)}
.nav .pages a[aria-current]{color:var(--accent);border-color:var(--accent)}
.contact{background:var(--n-bg);color:var(--n-fg)}
.contact .inner{border-top:1px solid color-mix(in srgb,var(--n-fg) 14%,transparent);padding-block:20px 28px;display:flex;flex-wrap:wrap;gap:8px 32px;font-size:14px}
.contact span{user-select:all;font-variant-numeric:tabular-nums}
.contact b{font-weight:600}

/* project */
.cover .inner{min-height:calc(100svh - 58px - env(safe-area-inset-top,0px));display:grid;grid-template-columns:1fr;gap:28px;align-content:center;padding-block:32px 40px}
@media (min-width:960px){.cover .inner{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:center;gap:56px}}
.cover-text{display:grid;gap:18px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.meta b{color:var(--accent);font-weight:700}
.cover h1{margin:0;font-family:var(--display);font-weight:var(--dw);text-transform:var(--tt);font-stretch:var(--ds);letter-spacing:var(--dls);font-size:clamp(54px,9vw,128px);line-height:.9;text-wrap:balance;overflow-wrap:anywhere}
.urdu{font-family:'Noto Nastaliq Urdu',serif;direction:rtl;text-align:left;font-size:clamp(26px,3.4vw,40px);line-height:2;color:var(--accent);margin:-6px 0 -10px}
.tagline{font-size:clamp(17px,1.8vw,20px);max-width:44ch;margin:0;color:color-mix(in srgb,var(--fg) 85%,var(--bg))}
.brief .inner{display:grid;gap:32px;padding-block:56px;border-top:1px solid color-mix(in srgb,var(--fg) 14%,transparent)}
@media (min-width:860px){.brief .inner{grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:64px}}
.brief h2,.gallery h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 14px;font-family:var(--body)}
.brief p{margin:0 0 14px;max-width:62ch;font-size:17px}
.facts{display:grid;gap:20px;margin:0}
.facts dt{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--surface);border-radius:999px;padding:4px 11px;font-size:14px}
.gallery .inner{padding-block:8px 72px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.slot{grid-column:span 12;position:relative;border-radius:3px;overflow:hidden;background:var(--surface);aspect-ratio:var(--r,16/9);max-width:100%;display:grid;place-items:center;margin:0}
.slot.empty{background:repeating-linear-gradient(135deg,var(--surface) 0 14px,color-mix(in srgb,var(--surface) 80%,var(--accent)) 14px 15px)}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot figcaption{text-align:center;padding:12px;display:grid;gap:4px}
.slot figcaption b{font-family:var(--display);text-transform:var(--tt);font-stretch:var(--ds);font-weight:var(--dw);font-size:clamp(20px,2.4vw,28px);line-height:1.05;letter-spacing:var(--dls)}
.slot figcaption small{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cover .slot{aspect-ratio:4/3}
@media (min-width:700px){
  .slot.half{grid-column:span 6;--r:4/3}
  .slot.third{grid-column:span 4;--r:4/5}
}
.slot.wide{--r:16/8}
.next{display:block;text-decoration:none;background:var(--n-bg);color:var(--n-fg)}
.next .inner{padding-block:56px 72px;display:grid;gap:10px}
.next small{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.next strong{font-family:var(--n-display);font-weight:var(--n-dw);text-transform:var(--n-tt);font-stretch:var(--n-ds);letter-spacing:var(--n-dls);font-size:clamp(44px,8vw,104px);line-height:.92}
.next strong span{color:var(--n-ac);display:inline-block;transition:transform .25s}
.next:hover strong span{transform:translateX(10px)}
.cover-img{margin:0;justify-self:center}
.cover-img img{display:block;max-width:100%;width:auto;max-height:calc(100svh - 150px);box-shadow:0 24px 60px rgba(0,0,0,.4)}
.tag-ur{font-family:'Noto Nastaliq Urdu',serif;direction:rtl;text-align:left;font-size:clamp(20px,2.2vw,26px);line-height:2;margin:-8px 0 -14px}
.sec .inner{padding-block:56px;border-top:1px solid color-mix(in srgb,var(--fg) 14%,transparent)}
.sec-head{display:grid;gap:8px;margin-bottom:28px}
.sec-head h2{margin:0;font-family:var(--display);font-weight:var(--dw);text-transform:var(--tt);font-stretch:var(--ds);letter-spacing:var(--dls);font-size:clamp(32px,4.4vw,54px);line-height:1}
.sec-head p{margin:0;max-width:62ch;color:var(--muted)}
.shots{display:grid;grid-template-columns:repeat(var(--m),minmax(0,1fr));gap:20px 16px;align-items:start}
@media (min-width:760px){.shots{grid-template-columns:repeat(var(--c),minmax(0,1fr))}}
.shot{margin:0;display:grid;gap:10px;min-width:0}
.shot.span{grid-column:1/-1}
.zoom{all:unset;cursor:zoom-in;display:block;border-radius:2px}
.zoom:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.shot img{display:block;width:100%;height:auto;box-shadow:0 12px 32px rgba(0,0,0,.35);transition:transform .3s}
.zoom:hover img{transform:translateY(-3px)}
.shot figcaption{font-size:13px;color:var(--muted)}
.vid{display:block;width:100%;max-width:980px;aspect-ratio:16/9;background:#000;border-radius:3px;box-shadow:0 18px 44px rgba(0,0,0,.28)}
.shots.bare{gap:10px}
@media (min-width:760px){.shots.bare{grid-template-columns:repeat(7,minmax(0,1fr))}}
@media (min-width:1100px){.shots.bare{grid-template-columns:repeat(var(--c),minmax(0,1fr))}}
.shots.bare img{box-shadow:none;border-radius:4px}
.shots.bare figcaption{text-align:center;font-family:var(--display);font-size:15px}
.cards{display:grid;grid-template-columns:repeat(var(--m),minmax(0,1fr));gap:14px}
@media (min-width:760px){.cards{grid-template-columns:repeat(var(--c),minmax(0,1fr))}}
.card{background:var(--surface);padding:24px 26px;border-radius:2px;min-width:0}
.card h3{margin:0 0 10px;font-family:var(--display);font-weight:var(--dw);font-size:24px;line-height:1.15;letter-spacing:var(--dls);color:var(--fg)}
.card p{margin:0;max-width:56ch}
.card ul{margin:0;padding-left:1.1em;display:grid;gap:6px}
.card li::marker{color:var(--accent)}
.tee{display:block;position:relative;background:var(--surface);aspect-ratio:1;padding:9%;isolation:isolate}
.tee svg{display:block;width:100%;height:100%}
.tee .print{position:absolute;left:34%;right:34%;top:27%;bottom:30%;display:flex;align-items:flex-start;justify-content:center}
.shot .tee img{width:auto;height:auto;max-width:100%;max-height:100%;box-shadow:none}
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,4,5,.92);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lb img{max-width:100%;max-height:92svh;width:auto;height:auto;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.lb button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));font:600 14px/1 'Figtree',system-ui,sans-serif;color:#fff;background:rgba(255,255,255,.12);border:0;border-radius:999px;padding:10px 16px;cursor:pointer}
.layouts-grid .cover{background-image:linear-gradient(color-mix(in srgb,var(--accent) 12%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--accent) 12%,transparent) 1px,transparent 1px);background-size:48px 48px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const app = document.getElementById('app'), nav = document.getElementById('nav'), root = document.documentElement;
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function theme(t){
  for (const k of ['bg','fg','accent','muted','surface','display','body','tt','dw','ds','dls']) root.style.setProperty('--'+k, t[k]);
  root.style.colorScheme = t.scheme || 'dark';
}
const vars = (p, pre) => `--${pre}-bg:${p.t.bg};--${pre}-fg:${p.t.fg};--${pre}-ac:${p.t.accent};--${pre}-display:${p.t.display};--${pre}-dw:${p.t.dw};--${pre}-tt:${p.t.tt};--${pre}-ds:${p.t.ds};--${pre}-dls:${p.t.dls}`;

function slot([label, size, src], cls=''){
  return src
    ? `<figure class="slot ${size||''} ${cls}"><img src="${esc(src)}" alt="${esc(label)}" loading="lazy"></figure>`
    : `<figure class="slot empty ${size||''} ${cls}" aria-label="${esc(label)} (image to come)"><figcaption><b>${esc(label)}</b><small>Image to come</small></figcaption></figure>`;
}

// Plain tee drawn in SVG; the artwork is blended onto the chest (multiply on light fabric, screen on dark)
function teeMock(src, alt, color){
  const dark = parseInt(color.slice(1,3),16) < 80;
  return `<span class="tee">
    <svg viewBox="0 0 400 440" aria-hidden="true">
      <path d="M150 22C170 44 230 44 250 22L330 46C350 54 362 70 372 90L396 150 338 172 322 146V424H78V146L62 172 4 150 28 90C38 70 50 54 70 46Z" fill="${color}" stroke="${dark ? 'rgba(255,255,255,.14)' : 'rgba(0,0,0,.08)'}" stroke-width="2"/>
      <path d="M150 22C170 54 230 54 250 22" fill="none" stroke="${dark ? 'rgba(255,255,255,.18)' : 'rgba(0,0,0,.12)'}" stroke-width="5"/>
    </svg>
    <span class="print"><img src="${src}" alt="${esc(alt)}" loading="lazy" style="mix-blend-mode:${dark ? 'screen' : 'multiply'}"></span>
  </span>`;
}

function renderProject(i){
  const p = PROJECTS[i], nx = PROJECTS[(i+1) % PROJECTS.length], pv = PROJECTS[(i-1+PROJECTS.length) % PROJECTS.length];
  theme(p.t);
  document.body.className = p.cls || '';
  nav.innerHTML = `<span class="pages">${PROJECTS.map((q,j)=>`<a href="#${q.id}" title="${esc(q.name)}"${j===i?' aria-current="page"':''}>${pad(j+1)}</a>`).join('')}</span>
    <span class="count">${pad(i+1)} / ${pad(PROJECTS.length)}</span>
    <a href="#${pv.id}" aria-label="Previous: ${esc(pv.name)}">←</a><a href="#${nx.id}" aria-label="Next: ${esc(nx.name)}">→</a>`;
  app.innerHTML = `
  <article>
    <header class="cover wrap"><div class="inner">
      <div class="cover-text">
        <div class="meta"><b>${pad(i+1)}</b><span>${esc(p.cat)}</span>${p.year ? `<span>${esc(p.year)}</span>` : ''}</div>
        <h1>${esc(p.name)}</h1>
        ${p.urdu ? `<p class="urdu" lang="ur">${p.urdu}</p>` : ''}
        ${p.taglineEn ? `<p class="tag-ur" lang="ur">${esc(p.tagline)}</p><p class="tagline">${esc(p.taglineEn)}</p>` : `<p class="tagline">${esc(p.tagline)}</p>`}
      </div>
      ${p.coverImg ? `<figure class="cover-img"><button class="zoom" data-src="${p.coverImg}" aria-label="Enlarge ${esc(p.cover)}"><img src="${p.coverImg}" alt="${esc(p.cover)}"></button></figure>` : slot([p.cover])}
    </div></header>
    <section class="brief wrap"><div class="inner">
      <div><h2>About the project</h2>${p.about.map(a=>`<p>${esc(a)}</p>`).join('')}</div>
      <dl class="facts">
        <div><dt>Role</dt><dd>${esc(p.role)}</dd></div>
        <div><dt>Deliverables</dt><dd class="chips">${p.deliverables.map(d=>`<span>${esc(d)}</span>`).join('')}</dd></div>
        <div><dt>Tools</dt><dd>${p.tools.map(esc).join(' · ')}</dd></div>
      </dl>
    </div></section>
    ${p.sections ? p.sections.map(s => `
    <section class="sec wrap"><div class="inner">
      <div class="sec-head"><h2>${esc(s.title)}</h2>${s.note ? `<p>${esc(s.note)}</p>` : ''}</div>
      ${s.video ? `<video class="vid" controls preload="none" playsinline poster="${s.video.poster}" aria-label="${esc(s.video.label)}"><source src="${s.video.src}" type="video/mp4"></video>` : s.cards ? `<div class="cards" style="--c:${s.cols};--m:${s.m}">${s.cards.map(c => `<div class="card"><h3>${esc(c.h)}</h3>${c.p ? `<p>${esc(c.p)}</p>` : `<ul>${c.list.map(l => `<li>${esc(l)}</li>`).join('')}</ul>`}</div>`).join('')}</div>` : `
      <div class="shots${s.bare ? ' bare' : ''}" style="--c:${s.cols};--m:${s.m}">${s.items.map(([f, cap, span, tee]) => {
        const src = `img/${p.id.split('-')[0]}/${f}.jpg`, alt = cap || s.title;
        const art = tee ? teeMock(src, alt, tee) : `<img src="${src}" alt="${esc(alt)}" loading="lazy">`;
        return `<figure class="shot${span ? ' span' : ''}"><button class="zoom" data-src="${src}" aria-label="Enlarge ${esc(alt)}">${art}</button>${cap ? `<figcaption>${esc(cap)}</figcaption>` : ''}</figure>`;
      }).join('')}</div>`}
    </div></section>`).join('') : `
    <section class="gallery wrap"><div class="inner">
      <h2>The work</h2>
      <div class="grid">${p.slots.map(s=>slot(s)).join('')}</div>
    </div></section>`}
    <a class="next wrap" href="#${nx.id}" style="${vars(nx,'n')}"><div class="inner">
      <small>Next project · ${pad((i+1)%PROJECTS.length+1)}</small>
      <strong>${esc(nx.name)} <span>→</span></strong>
    </div></a>
    <footer class="contact wrap" style="${vars(nx,'n')}"><div class="inner">
      <b>Eman Mughal · Graphic Designer</b><span>mughaleman94@gmail.com</span><span>+92 333 1577138</span>
    </div></footer>
  </article>`;
}

function route(){
  const i = Math.max(0, PROJECTS.findIndex(p => p.id === location.hash.slice(1)));
  renderProject(i);
  document.title = `${PROJECTS[i].name} · Eman Mughal`;
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
let lb = null;
const closeLb = () => { if (lb) { lb.remove(); lb = null; } };
app.addEventListener('click', e => {
  const z = e.target.closest('.zoom'); if (!z) return;
  lb = document.createElement('div'); lb.className = 'lb';
  lb.innerHTML = `<img src="${z.dataset.src}" alt=""><button type="button">Close</button>`;
  lb.addEventListener('click', closeLb);
  document.body.appendChild(lb); lb.querySelector('button').focus();
});
addEventListener('keydown', e => {
  if (e.key === 'Escape') return closeLb();
  if (lb || e.target.closest('input,textarea') || e.metaKey || e.ctrlKey) return;
  const i = PROJECTS.findIndex(p => p.id === location.hash.slice(1));
  if (i < 0) return;
  if (e.key === 'ArrowRight') location.hash = PROJECTS[(i+1) % PROJECTS.length].id;
  if (e.key === 'ArrowLeft') location.hash = PROJECTS[(i-1+PROJECTS.length) % PROJECTS.length].id;
});
route();
</script>
